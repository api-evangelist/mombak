name: Mombak
description: >-
  Mombak is a Brazilian nature-based carbon removal company that acquires
  degraded and deforested land in the Amazon and restores it through
  large-scale, biodiverse reforestation with native species, generating
  high-integrity, high-quality carbon removal credits for corporate buyers.
  Founded by former Nubank executives and backed by investors including Union
  Square Ventures, the company combines science, technology, forestry, and
  carbon-market expertise to remove carbon at scale while restoring native
  ecosystems. Mombak operates as a corporate and carbon-markets business and
  publishes a public marketing and news presence; it does not currently expose a
  public developer API, SDK, or API documentation. This profile was surfaced as
  a portfolio company of Union Square Ventures and enriched by the API
  Evangelist pipeline.
